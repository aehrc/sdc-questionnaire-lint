name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm install --global "$(node -p 'require("./package.json").packageManager')"
      - run: npm ci
      # The FHIR packages SUSHI downloads to compile the lint cases (packages/core/test/cases).
      - uses: actions/cache@v6
        with:
          path: ~/.fhir
          key: fhir-packages-${{ hashFiles('package-lock.json') }}
          restore-keys: fhir-packages-
      - run: npm run check
      - if: matrix.node == 22
        run: npm pack --workspaces --dry-run

  # The CLI contract on Windows, where path separators, path bases and the executable shims differ.
  windows-cli:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm install --global "$(node -p 'require("./package.json").packageManager')"
        shell: bash
      - run: npm ci
      - run: npm test -- packages/core/test/cli
