name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm install --global "$(node -p 'require("./package.json").packageManager')"
      - run: npm ci
      - run: npm run check
      - if: matrix.node == 22
        run: npm pack --workspaces --dry-run
