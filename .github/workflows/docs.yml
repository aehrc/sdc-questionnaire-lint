name: Docs

# Builds the documentation site on every push to main and deploys it to GitHub Pages, at
# https://aehrc.github.io/sdc-questionnaire-lint/. Pages must be enabled with GitHub Actions as
# its source (Settings → Pages).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push waits rather than cancelling one in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm install --global "$(node -p 'require("./package.json").packageManager')"
      - run: npm ci
      # The FHIR packages SUSHI downloads to compile the lint cases the rules library shows.
      - uses: actions/cache@v6
        with:
          path: ~/.fhir
          key: fhir-packages-${{ hashFiles('package-lock.json') }}
          restore-keys: fhir-packages-
      - uses: actions/configure-pages@v6
      - run: npm run docs:build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
