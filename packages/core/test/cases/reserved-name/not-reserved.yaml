# Other names, a name only like a reserved one, and contained resources.
extensions:
  - url: variable
    name: weight
    expression: '1'
  - url: variable
    name: vsconditions
    expression: '2'
fsh:
  - 'extension[+].url = "http://hl7.org/fhir/uv/sdc/StructureDefinition/sdc-questionnaire-launchContext"'
  - 'extension[=].extension[0].url = "name"'
  - 'extension[=].extension[=].valueCoding = http://hl7.org/fhir/uv/sdc/CodeSystem/launchContext#patient'
  - 'extension[=].extension[+].url = "type"'
  - 'extension[=].extension[=].valueCode = #Patient'
items:
  - linkId: a
    type: string
    extensions:
      - url: variable
        name: Resource
        expression: '3'
contained:
  - extensions:
      - url: variable
        name: qitem
        expression: '4'
