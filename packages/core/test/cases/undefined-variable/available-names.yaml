# Declarations, built-in names and host variables are available. D13: rendering may reference a
# named initialExpression. D8: a later declaration on the same element is available.
hostVariables: [PrePopQuery]
extensions:
  - url: variable
    name: total
    expression: '%PrePopQuery.total'
fsh:
  - 'extension[+].url = "http://hl7.org/fhir/uv/sdc/StructureDefinition/sdc-questionnaire-launchContext"'
  - 'extension[=].extension[0].url = "name"'
  - 'extension[=].extension[=].valueCoding = http://hl7.org/fhir/uv/sdc/CodeSystem/launchContext#patient'
  - 'extension[=].extension[+].url = "type"'
  - 'extension[=].extension[=].valueCode = #Patient'
items:
  - linkId: a
    type: string
    extensions:
      - url: itemPopulationContext
        name: ctx
        expression: '%patient'
      - url: calculatedExpression
        expression: '%init + %total + %ctx.count() + %resource.count() + %qitem.count() + %`vs-x`.count()'
      - url: initialExpression
        name: init
        expression: '%later'
      - url: variable
        name: later
        expression: '1'
