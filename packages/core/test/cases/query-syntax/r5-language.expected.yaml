- ruleId: sdc/query-syntax
  severity: error
  at: input/fsh/query-syntax-r5-language.fsh:9:51
  message: This x-fhir-query is not a FHIR search, so the form's request fails and the fields it fills stay empty.
  help: set the language to text/fhirpath; this expression is FHIRPath
  expression:
    text: '%patient.id'
- ruleId: sdc/query-syntax
  severity: error
  at: input/fsh/query-syntax-r5-language.fsh:14:71
  message: This x-fhir-query has a {{ with no closing }}, so the text after it is sent to the server as written instead of being evaluated.
  help: add }} after the embedded FHIRPath expression
  expression:
    text: Observation?subject={{%patient.id
    range:
      startOffset: 20
      endOffset: 22
