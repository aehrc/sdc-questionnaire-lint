# A missing linkId is reported at a root site, in each kind of selection. The form has a group g, its child a, and a's child c.
extensions:
  - url: variable
    name: v0
    expression: "%questionnaire.item.where(linkId = 'typo')"
  - url: variable
    name: v1
    expression: "%resource.item.where(linkId = 'typo')"
  - url: variable
    name: v2
    expression: "%context.item.where(linkId = 'typo')"
  - url: variable
    name: v3
    expression: "item.where(linkId = 'typo').answer.value"
  - url: variable
    name: v4
    expression: "repeat(item).where(linkId = 'typo').answer.value"
items:
  - linkId: g
    type: group
    items:
      - linkId: a
        type: boolean
        text: 'Smoker'
        items:
          - linkId: c
            type: string
