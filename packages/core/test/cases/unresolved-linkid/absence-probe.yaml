# A deliberate absence probe is not reported. The form has a group g, its child a, and a's child c.
items:
  - linkId: g
    type: group
    items:
      - linkId: a
        type: boolean
        text: 'Smoker'
        extensions:
          - url: calculatedExpression
            expression: "%resource.repeat(item).where(linkId = 'typo').exists()"
          - url: calculatedExpression
            expression: "%resource.repeat(item).where(linkId = 'typo').empty()"
          - url: calculatedExpression
            expression: "%resource.repeat(item).where(linkId = 'typo').count() = 0"
        items:
          - linkId: c
            type: string
