# A linkId of any item of this Questionnaire is accepted, at any depth and through answers. The form has a group g, its child a, and a's child c.
items:
  - linkId: g
    type: group
    items:
      - linkId: a
        type: boolean
        text: 'Smoker'
        extensions:
          - url: calculatedExpression
            expression: "%resource.repeat(item | answer.item).where(linkId = 'c').answer.value"
          - url: calculatedExpression
            expression: "%questionnaire.repeat(item).where(linkId = 'a').item.where(linkId = 'c')"
          - url: calculatedExpression
            expression: "item.where(linkId = 'c').answer.value"
        items:
          - linkId: c
            type: string
