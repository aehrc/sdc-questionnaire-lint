# Each missing linkId of a chain is reported. The form has a group g, its child a, and a's child c.
items:
  - linkId: g
    type: group
    items:
      - linkId: a
        type: boolean
        text: 'Smoker'
        extensions:
          - url: calculatedExpression
            expression: "item.where(linkId = 'x').item.where(linkId = 'y').answer.value"
        items:
          - linkId: c
            type: string
