# CQL is not checked. The form has a group g, its child a, and a's child c.
items:
  - linkId: g
    type: group
    items:
      - linkId: a
        type: boolean
        text: 'Smoker'
        extensions:
          - url: calculatedExpression
            language: text/cql
            expression: "item.where(linkId = 'typo')"
        items:
          - linkId: c
            type: string
