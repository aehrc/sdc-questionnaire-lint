# Help without a suggestion when no linkId is similar. The form has a group g, its child a, and a's child c.
items:
  - linkId: g
    type: group
    items:
      - linkId: a
        type: boolean
        text: 'Smoker'
        extensions:
          - url: calculatedExpression
            expression: "%resource.repeat(item).where(linkId = 'zzz')"
        items:
          - linkId: c
            type: string
