# No item target is inferred from %qitem at a root site. The form has a group g, its child a, and a's child c.
extensions:
  - url: variable
    name: v
    expression: "%qitem.item.where(linkId = 'typo')"
items:
  - linkId: g
    type: group
    items:
      - linkId: a
        type: boolean
        text: 'Smoker'
        items:
          - linkId: c
            type: string
