# One name on different elements is not a duplicate.
extensions:
  - url: variable
    name: a
    expression: '1'
fsh:
  - 'extension[+].url = "http://hl7.org/fhir/uv/sdc/StructureDefinition/sdc-questionnaire-launchContext"'
  - 'extension[=].extension[0].url = "name"'
  - 'extension[=].extension[=].valueCoding = http://hl7.org/fhir/uv/sdc/CodeSystem/launchContext#patient'
  - 'extension[=].extension[+].url = "type"'
  - 'extension[=].extension[=].valueCode = #Patient'
items:
  - linkId: g
    type: group
    extensions:
      - url: variable
        name: a
        expression: '2'
    items:
      - linkId: q
        type: string
        extensions:
          - url: variable
            name: a
            expression: '3'
  - linkId: h
    type: string
    extensions:
      - url: variable
        name: patient
        expression: '4'
