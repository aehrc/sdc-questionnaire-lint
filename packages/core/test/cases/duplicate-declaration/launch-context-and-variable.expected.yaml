- ruleId: sdc/duplicate-declaration
  severity: error
  at: input/fsh/duplicate-declaration-launch-context-and-variable.fsh:13:46
  message: The name %patient is declared more than once on the Questionnaire root, so it is unclear which value expressions that use it get.
  help: rename or remove one of the declarations of %patient
  expression:
    text: '1'
  related:
    - at: /extension/0 (source-unavailable)
      message: '%patient is also declared here'
- ruleId: sdc/unused-declaration
  severity: warning
  at: input/fsh/duplicate-declaration-launch-context-and-variable.fsh:13:46
  message: '%patient is declared on the Questionnaire root, but no expression references it, so its value is never used.'
  help: remove the variable, or reference %patient where its value is needed
  expression:
    text: '1'
