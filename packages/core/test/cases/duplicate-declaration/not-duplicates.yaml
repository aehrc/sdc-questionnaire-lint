# Different names, unnamed expressions and contained resources are not duplicates.
extensions:
  - url: variable
    name: a
    expression: '1'
  - url: variable
    name: b
    expression: '2'
items:
  - linkId: q
    type: string
    extensions:
      - url: calculatedExpression
        expression: '3'
      - url: calculatedExpression
        expression: '4'
contained:
  - extensions:
      - url: variable
        name: c
        expression: '5'
      - url: variable
        name: c
        expression: '6'
