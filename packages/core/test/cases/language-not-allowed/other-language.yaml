# Another language these places do not allow.
items:
  - linkId: enable-when
    type: string
    extensions:
      - url: enableWhenExpression
        language: text/javascript
        reference: '#lib'
  - linkId: toggle
    type: string
    fsh:
      - 'extension[+].url = "http://hl7.org/fhir/uv/sdc/StructureDefinition/sdc-questionnaire-answerOptionsToggleExpression"'
      - 'extension[=].extension[0].url = "option"'
      - 'extension[=].extension[=].valueCoding = http://example.org/codes#a'
      - 'extension[=].extension[+].url = "expression"'
      - 'extension[=].extension[=].valueExpression.language = #text/javascript'
      - 'extension[=].extension[=].valueExpression.reference = "#lib2"'
