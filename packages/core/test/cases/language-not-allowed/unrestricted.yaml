# Any language is allowed where SDC has no restriction, and at contextExpression.
items:
  - linkId: calculated
    type: string
    extensions:
      - url: calculatedExpression
        language: text/x-fhir-query
        expression: 'Patient?_id=1'
  - linkId: context
    type: string
    fsh:
      - 'extension[+].url = "http://hl7.org/fhir/uv/sdc/StructureDefinition/sdc-questionnaire-contextExpression"'
      - 'extension[=].extension[0].url = "expression"'
      - 'extension[=].extension[=].valueExpression.language = #text/javascript'
      - 'extension[=].extension[=].valueExpression.expression = "x"'
