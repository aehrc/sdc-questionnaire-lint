      - 'extension[=].extension[+].url = "expression"'
      - 'extension[=].extension[=].valueExpression.language = #text/cql-identifier'
      - 'extension[=].extension[=].valueExpression.expression = "2 = 2"'
  - linkId: enable-when-3
    type: string
    extensions:
      - url: enableWhenExpression
        language: text/cql-expression
        expression: '3 = 1'
  - linkId: toggle-3
    type: string
