# Duplicates on one element, siblings and contained resources do not shadow.
extensions:
  - url: variable
    name: a
    expression: '1'
  - url: variable
    name: a
    expression: '2'
items:
  - linkId: x
    type: string
    extensions:
      - url: variable
        name: b
        expression: '3'
  - linkId: y
    type: group
    extensions:
      - url: variable
        name: b
        expression: '4'
    items:
      - linkId: z
        type: string
contained:
  - extensions:
      - url: variable
        name: c
        expression: '5'
    items:
      - linkId: q
        type: string
        extensions:
          - url: variable
            name: c
            expression: '6'
