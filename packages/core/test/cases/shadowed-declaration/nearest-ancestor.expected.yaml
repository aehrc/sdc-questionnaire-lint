  at: input/fsh/shadowed-declaration-nearest-ancestor.fsh:14:51
  message: The name %a on item g is also declared on the Questionnaire root, so other expressions on item g and its descendant items get this declaration's value.
  help: rename one of the declarations of %a, unless this item should override it
  expression:
    text: '2'
  related:
    - at: /extension/0/valueExpression/expression (source-unavailable)
      message: '%a is also declared here'
