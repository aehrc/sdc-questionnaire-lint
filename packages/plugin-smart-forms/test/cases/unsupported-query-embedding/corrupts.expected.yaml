- ruleId: smart-forms/unsupported-query-embedding
  severity: error
  at: input/fsh/unsupported-query-embedding-corrupts.fsh:8:63
  message: Smart Forms builds a regular expression from the text inside {{…}} and applies it to every query, and this text also matches other text in this query and the query of %encounters, so it corrupts those URLs.
  help: keep the text inside {{…}} to a launch context and a path, such as {{%patient.id}}
  expression:
    text: Condition?patient={{%patient.id|id}}
    range:
      startOffset: 20
      endOffset: 34
  related:
    - at: /item/0/extension/0/valueExpression/expression (source-unavailable)
      message: this query is corrupted
