# Population reads only the first contained Bundle with the id sourceQueries references, so the
# request URL of the second is not corrupted.
rules:
  sdc/unused-declaration: 'off'
extensions:
  - url: variable
    name: conditions
    language: application/x-fhir-query
    expression: 'Condition?patient={{%patient.id|x}}'
fsh:
  - 'extension[+].url = "http://hl7.org/fhir/uv/sdc/StructureDefinition/sdc-questionnaire-launchContext"'
  - 'extension[=].extension[0].url = "name"'
  - 'extension[=].extension[=].valueCoding = http://hl7.org/fhir/uv/sdc/CodeSystem/launchContext#patient'
  - 'extension[=].extension[+].url = "type"'
  - 'extension[=].extension[=].valueCode = #Patient'
  - 'extension[+].url = "http://hl7.org/fhir/uv/sdc/StructureDefinition/sdc-questionnaire-sourceQueries"'
  - 'extension[=].valueReference.reference = "#prepop"'
  - 'contained[0].resourceType = "Bundle"'
  - 'contained[0].id = "prepop"'
  - 'contained[0].type = #batch'
  - 'contained[0].entry[0].request.method = #GET'
  - 'contained[0].entry[0].request.url = "Observation?subject={{%patient.id}}"'
  - 'contained[1].resourceType = "Bundle"'
  - 'contained[1].id = "prepop"'
  - 'contained[1].type = #batch'
  - 'contained[1].entry[0].request.method = #GET'
  - 'contained[1].entry[0].request.url = "Encounter?subject={{%patient.id}}"'
items:
  - linkId: q
    type: string
