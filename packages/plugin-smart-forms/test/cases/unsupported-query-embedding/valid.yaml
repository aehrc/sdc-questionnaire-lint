# Embeddings Smart Forms population fills as written: several in one query, a custom launch
# context name, operators with literals, and %context and %ucum in the path.
rules:
  sdc/unused-declaration: 'off'
extensions:
  - url: variable
    name: conditions
    language: application/x-fhir-query
    expression: 'Condition?patient={{%patient.id}}&encounter={{%role.id}}'
  - url: variable
    name: observations
    language: application/x-fhir-query
    expression: "Observation?subject={{%patient.id & '-x'}}&code={{%patient.id = 'p1'}}"
  - url: variable
    name: encounters
    language: application/x-fhir-query
    expression: 'Encounter?a={{%patient.id & %context.id}}&b={{%patient.id & %ucum}}&c={{%patient.id.length div 1}}'
fsh:
  - 'extension[+].url = "http://hl7.org/fhir/uv/sdc/StructureDefinition/sdc-questionnaire-launchContext"'
  - 'extension[=].extension[0].url = "name"'
  - 'extension[=].extension[=].valueCoding = http://hl7.org/fhir/uv/sdc/CodeSystem/launchContext#patient'
  - 'extension[=].extension[+].url = "type"'
  - 'extension[=].extension[=].valueCode = #Patient'
  - 'extension[+].url = "http://hl7.org/fhir/uv/sdc/StructureDefinition/sdc-questionnaire-launchContext"'
  - 'extension[=].extension[0].url = "name"'
  - 'extension[=].extension[=].valueId = "role"'
  - 'extension[=].extension[+].url = "type"'
  - 'extension[=].extension[=].valueCode = #PractitionerRole'
