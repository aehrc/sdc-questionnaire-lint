- ruleId: smart-forms/unsupported-query-embedding
  severity: error
  at: input/fsh/unsupported-query-embedding-no-launch-context.fsh:8:63
  message: Smart Forms replaces {{…}} only when a launch context is supplied, and this Questionnaire declares none, so the query is sent with its braces.
  help: declare a launch context named patient on the Questionnaire root
  expression:
    text: Condition?patient={{%patient.id}}&code={{%patient.id = ')'}}
    range:
