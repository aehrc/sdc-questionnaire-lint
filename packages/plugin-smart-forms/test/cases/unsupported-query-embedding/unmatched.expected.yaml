- ruleId: smart-forms/unsupported-query-embedding
  severity: error
  at: input/fsh/unsupported-query-embedding-unmatched.fsh:8:66
  message: Smart Forms builds a regular expression from the text inside {{…}}, and this text does not match itself, so the query is sent with its braces.
  help: keep the text inside {{…}} to a launch context and a path, such as {{%patient.id}}
  expression:
    text: Condition?patient={{%patient.id.first()}}
    range:
      startOffset: 20
      endOffset: 39
- ruleId: smart-forms/unsupported-query-embedding
  severity: error
  at: input/fsh/unsupported-query-embedding-unmatched.fsh:12:66
  message: Smart Forms builds a regular expression from the text inside {{…}}, and this text does not match itself, so the query is sent with its braces.
  help: keep the text inside {{…}} to a launch context and a path, such as {{%patient.id}}
  expression:
    text: Condition?patient={{%patient.id + 'x'}}
    range:
      startOffset: 20
      endOffset: 37
- ruleId: smart-forms/unsupported-query-embedding
  severity: error
  at: input/fsh/unsupported-query-embedding-unmatched.fsh:16:66
  message: Smart Forms builds a regular expression from the text inside {{…}}, and this text does not match itself, so the query is sent with its braces.
