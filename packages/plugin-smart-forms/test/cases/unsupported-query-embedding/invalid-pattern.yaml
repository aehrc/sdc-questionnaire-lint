# Text that is not a valid regular expression, including a metacharacter inside a string
# literal; the second does not parse either, so sdc/fragment-parse-error reports it too.
rules:
  sdc/unused-declaration: 'off'
extensions:
  - url: variable
    name: a
    language: application/x-fhir-query
    expression: "Condition?patient={{%patient.id = ')'}}"
  - url: variable
    name: b
    language: application/x-fhir-query
    expression: 'Condition?patient={{%patient.id(}}'
fsh:
  - 'extension[+].url = "http://hl7.org/fhir/uv/sdc/StructureDefinition/sdc-questionnaire-launchContext"'
  - 'extension[=].extension[0].url = "name"'
  - 'extension[=].extension[=].valueCoding = http://hl7.org/fhir/uv/sdc/CodeSystem/launchContext#patient'
  - 'extension[=].extension[+].url = "type"'
  - 'extension[=].extension[=].valueCode = #Patient'
