- ruleId: smart-forms/unsupported-query-embedding
  severity: error
  at: input/fsh/unsupported-query-embedding-unavailable.fsh:12:80
  message: Smart Forms evaluates the text after %patient with only the launch resource, so %encounter is not available and the embedding becomes empty.
  help: inside {{…}} only %context, %ucum, %terminologyUrl and %async are available, and %fhirServerUrl when a source server is configured
  expression:
    text: Condition?patient={{%patient.id & %encounter.id}}
    range:
      startOffset: 34
      endOffset: 44
