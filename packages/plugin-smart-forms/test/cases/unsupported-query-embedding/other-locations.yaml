# Queries population does not fetch: the R5 query code (smart-forms/unsupported-expression-language
# reports it), a variable with no name, and a contextExpression.
rules:
  sdc/unused-declaration: 'off'
extensions:
  - url: variable
    name: r5
    language: text/x-fhir-query
    expression: 'Condition?patient={{ %patient.id }}'
  - url: variable
    language: application/x-fhir-query
    expression: 'Condition?patient={{ %patient.id }}'
fsh:
  - 'extension[+].url = "http://hl7.org/fhir/uv/sdc/StructureDefinition/sdc-questionnaire-launchContext"'
  - 'extension[=].extension[0].url = "name"'
  - 'extension[=].extension[=].valueCoding = http://hl7.org/fhir/uv/sdc/CodeSystem/launchContext#patient'
  - 'extension[=].extension[+].url = "type"'
  - 'extension[=].extension[=].valueCode = #Patient'
items:
  - linkId: q
    type: string
    fsh:
      - 'extension[+].url = "http://hl7.org/fhir/uv/sdc/StructureDefinition/sdc-questionnaire-contextExpression"'
      - 'extension[=].extension[0].url = "expression"'
      - 'extension[=].extension[=].valueExpression.language = #application/x-fhir-query'
      - 'extension[=].extension[=].valueExpression.expression = "Condition?patient={{ %patient.id }}"'
