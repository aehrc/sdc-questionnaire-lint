# An answerOptionsToggleExpression in a CQL code, which the renderer runs as FHIRPath.
items:
  - linkId: cql
    type: string
    text: CQL
    fsh:
      - 'extension[+].url = "http://hl7.org/fhir/uv/sdc/StructureDefinition/sdc-questionnaire-answerOptionsToggleExpression"'
      - 'extension[=].extension[0].url = "option"'
      - 'extension[=].extension[=].valueCoding = http://example.org/codes#a'
      - 'extension[=].extension[+].url = "expression"'
      - 'extension[=].extension[=].valueExpression.language = #text/cql'
      - 'extension[=].extension[=].valueExpression.expression = "true"'
  - linkId: cql-expression
    type: string
    text: CQL expression
    fsh:
      - 'extension[+].url = "http://hl7.org/fhir/uv/sdc/StructureDefinition/sdc-questionnaire-answerOptionsToggleExpression"'
      - 'extension[=].extension[0].url = "option"'
      - 'extension[=].extension[=].valueCoding = http://example.org/codes#a'
      - 'extension[=].extension[+].url = "expression"'
      - 'extension[=].extension[=].valueExpression.language = #text/cql-expression'
      - 'extension[=].extension[=].valueExpression.expression = "true"'
