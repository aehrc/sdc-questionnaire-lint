# An answerOptionsToggleExpression without an option, which the renderer does not evaluate.
items:
  - linkId: bp
    type: string
    fsh:
      - 'extension[+].url = "http://hl7.org/fhir/uv/sdc/StructureDefinition/sdc-questionnaire-answerOptionsToggleExpression"'
      - 'extension[=].extension[0].url = "expression"'
      - 'extension[=].extension[=].valueExpression.language = #text/cql'
      - 'extension[=].extension[=].valueExpression.expression = "true"'
