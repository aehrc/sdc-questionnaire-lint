- ruleId: smart-forms/questionnaire-variable-unavailable
  severity: error
  at: input/fsh/questionnaire-variable-unavailable-host-variables.fsh:14:51
  message: Smart Forms does not supply %questionnaire, so this calculatedExpression on item age fails when the reference is evaluated, and the answer is not calculated from it.
  help: copy the value the expression needs from the Questionnaire into the expression
  note: if the application running the form supplies %questionnaire, suppress this finding with a reason that names the application
  expression:
    text: '%questionnaire.title'
    range:
      startOffset: 0
      endOffset: 14
