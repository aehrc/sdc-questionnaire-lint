- ruleId: sdc/unused-declaration
  severity: warning
  at: input/fsh/questionnaire-variable-unavailable-variables.fsh:8:43
  message: '%title is declared on the Questionnaire root, but no expression references it, so its value is never used.'
  help: remove the variable, or reference %title where its value is needed
  expression:
    text: '%questionnaire.title'
- ruleId: sdc/unused-declaration
  severity: warning
  at: input/fsh/questionnaire-variable-unavailable-variables.fsh:20:51
  message: '%t is declared on item "Age" (age), but no expression references it, so its value is never used.'
  help: remove the variable, or reference %t where its value is needed
  expression:
    text: '%qitem.text'
- ruleId: smart-forms/questionnaire-variable-unavailable
  severity: error
  at: input/fsh/questionnaire-variable-unavailable-variables.fsh:8:43
  message: Smart Forms does not supply %questionnaire, so this variable on the Questionnaire root fails when the reference is evaluated, and %title gets no value from it.
  help: copy the value the expression needs from the Questionnaire into the expression
  note: if the application running the form supplies %questionnaire, suppress this finding with a reason that names the application
  expression:
    text: '%questionnaire.title'
    range:
      startOffset: 0
      endOffset: 14
- ruleId: smart-forms/questionnaire-variable-unavailable
  severity: error
  at: input/fsh/questionnaire-variable-unavailable-variables.fsh:20:51
  message: Smart Forms does not supply %qitem, so this variable on item "Age" (age) fails when the reference is evaluated, and %t gets no value from it.
  help: copy the value the expression needs from the Questionnaire into the expression
  note: if the application running the form supplies %qitem, suppress this finding with a reason that names the application
  expression:
    text: '%qitem.text'
    range:
      startOffset: 0
      endOffset: 6
