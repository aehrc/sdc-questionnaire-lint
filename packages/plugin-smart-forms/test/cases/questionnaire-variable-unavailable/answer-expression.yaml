# An answerExpression gets its own message and no note: with %questionnaire as its head its answers
# are never computed, with %qitem after another name only when the reference is evaluated.
fsh:
  - 'extension[+].url = "http://hl7.org/fhir/uv/sdc/StructureDefinition/sdc-questionnaire-launchContext"'
  - 'extension[=].extension[0].url = "name"'
  - 'extension[=].extension[=].valueCoding = http://hl7.org/fhir/uv/sdc/CodeSystem/launchContext#patient'
  - 'extension[=].extension[+].url = "type"'
  - 'extension[=].extension[=].valueCode = #Patient'
items:
  - linkId: head
    type: string
    text: Head
    extensions:
      - url: answerExpression
        expression: '%questionnaire.item.answerOption'
  - linkId: after
    type: string
    text: After
    extensions:
      - url: answerExpression
        expression: '%patient.name.where(text = %qitem.text)'
