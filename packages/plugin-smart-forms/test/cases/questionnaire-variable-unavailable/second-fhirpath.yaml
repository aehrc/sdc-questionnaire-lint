# A second text/fhirpath initialExpression, enableWhenExpression or answerExpression, which Smart
# Forms never reads.
fsh:
  - 'extension[+].url = "http://hl7.org/fhir/uv/sdc/StructureDefinition/sdc-questionnaire-launchContext"'
  - 'extension[=].extension[0].url = "name"'
  - 'extension[=].extension[=].valueCoding = http://hl7.org/fhir/uv/sdc/CodeSystem/launchContext#patient'
  - 'extension[=].extension[+].url = "type"'
  - 'extension[=].extension[=].valueCode = #Patient'
items:
  - linkId: initial
    type: string
    extensions:
      - url: initialExpression
        expression: "'a'"
      - url: initialExpression
        expression: '%qitem.text'
  - linkId: enable-when
    type: string
    extensions:
      - url: enableWhenExpression
        expression: 'true'
      - url: enableWhenExpression
        expression: '%qitem.text.exists()'
  - linkId: answer
    type: string
    extensions:
      - url: answerExpression
        expression: "'b'"
      - url: answerExpression
        expression: '%qitem.answerOption'
