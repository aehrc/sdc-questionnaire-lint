# A group's extractAllocateId declares questionnaire, and no extraction site can see it, with
# sdc/reserved-name off: silent, as for any declaration of the name.
rules:
  sdc/reserved-name: 'off'
items:
  - linkId: g
    type: group
    fsh:
      - 'extension[+].url = "http://hl7.org/fhir/uv/sdc/StructureDefinition/sdc-questionnaire-extractAllocateId"'
      - 'extension[=].valueString = "questionnaire"'
    items:
      - linkId: age
        type: string
        extensions:
          - url: calculatedExpression
            expression: '%questionnaire.title'
