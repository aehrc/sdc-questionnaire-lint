- ruleId: sdc/unused-declaration
  severity: warning
  at: input/fsh/questionnaire-variable-unavailable-named-questionnaire.fsh:8:43
  message: '%questionnaire is declared on the Questionnaire root, but no expression references it, so its value is never used.'
  help: remove the variable, or reference %questionnaire where its value is needed
  expression:
    text: '%questionnaire.title'
