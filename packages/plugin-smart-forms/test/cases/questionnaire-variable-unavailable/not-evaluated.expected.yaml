- ruleId: smart-forms/unsupported-expression-language
  severity: error
  at: input/fsh/questionnaire-variable-unavailable-not-evaluated.fsh:14:51
  message: Smart Forms ignores this calculatedExpression on item cql because it is written in text/cql; it uses only text/fhirpath here, so the answer is never calculated from it.
  help: rewrite it in FHIRPath with the language text/fhirpath; to use server data, fetch it in an application/x-fhir-query variable on this item or an ancestor and reference that variable
  expression:
    text: '%questionnaire.title'
