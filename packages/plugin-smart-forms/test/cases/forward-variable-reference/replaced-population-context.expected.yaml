- ruleId: smart-forms/variable-name-collision
  severity: error
  at: input/fsh/forward-variable-reference-replaced-population-context.fsh:30:51
  message: "%ctx is also declared on item g; Smart Forms keeps one value for each name, so expressions on either element can get the other's value."
  help: rename one of the declarations so the name is declared on one element only
  expression:
    text: '%patient.address'
  related:
    - at: /item/0/extension/0/valueExpression/expression (source-unavailable)
      message: '%ctx is also declared here'
