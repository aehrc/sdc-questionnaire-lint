# A root variable of the same name is bound first, so the reference reads its value;
# The silence holds with smart-forms/variable-name-collision off.
rules:
  smart-forms/variable-name-collision: 'off'
  sdc/unused-declaration: 'off'
extensions:
  - url: variable
    name: y
    expression: 'root'
fsh:
  - 'extension[+].url = "http://hl7.org/fhir/uv/sdc/StructureDefinition/sdc-questionnaire-launchContext"'
  - 'extension[=].extension[0].url = "name"'
  - 'extension[=].extension[=].valueCoding = http://hl7.org/fhir/uv/sdc/CodeSystem/launchContext#patient'
  - 'extension[=].extension[+].url = "type"'
  - 'extension[=].extension[=].valueCode = #Patient'
items:
  - linkId: g
    type: group
    extensions:
      - url: variable
        name: x
        expression: '%y'
      - url: variable
        name: y
        expression: 'item'
    items:
      - linkId: q
        type: string
        extensions:
          - url: initialExpression
            expression: '%x'
