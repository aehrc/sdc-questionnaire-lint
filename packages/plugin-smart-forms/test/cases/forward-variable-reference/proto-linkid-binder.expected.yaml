- ruleId: sdc/shadowed-declaration
  severity: info
  at: input/fsh/forward-variable-reference-proto-linkid-binder.fsh:30:59
  message: The name %y on item __proto__ is also declared on the Questionnaire root, so other expressions on item __proto__ and its descendant items get this declaration's value.
  help: rename one of the declarations of %y, unless this item should override it
  expression:
    text: '2'
  related:
    - at: /extension/1/valueExpression/expression (source-unavailable)
      message: '%y is also declared here'
- ruleId: smart-forms/forward-variable-reference
  severity: warning
  at: input/fsh/forward-variable-reference-proto-linkid-binder.fsh:8:46
  message: '%x references %y on the Questionnaire root, which Smart Forms evaluates after %x when it prefills the form, so %x has no value while the form is prefilled.'
  help: move %y before %x on the Questionnaire root
  expression:
    text: '%y'
    range:
      startOffset: 0
      endOffset: 2
  related:
    - at: /extension/1/valueExpression/expression (source-unavailable)
      message: '%y is declared here'
    - at: /item/0/extension/0/valueExpression/expression (source-unavailable)
      message: this prefill expression uses %x
- ruleId: smart-forms/variable-name-collision
  severity: error
  at: input/fsh/forward-variable-reference-proto-linkid-binder.fsh:30:59
  message: "%y is also declared on the Questionnaire root; Smart Forms keeps one value for each name, so expressions on either element can get the other's value."
  help: rename one of the declarations so the name is declared on one element only
  expression:
    text: '2'
  related:
    - at: /extension/1/valueExpression/expression (source-unavailable)
      message: '%y is also declared here'
