# Population reads variables only from an item's extension array, so a variable in its
# modifierExtension is never evaluated, wherever it is.
rules:
  sdc/unused-declaration: 'off'
fsh:
  - 'extension[+].url = "http://hl7.org/fhir/uv/sdc/StructureDefinition/sdc-questionnaire-launchContext"'
  - 'extension[=].extension[0].url = "name"'
  - 'extension[=].extension[=].valueCoding = http://hl7.org/fhir/uv/sdc/CodeSystem/launchContext#patient'
  - 'extension[=].extension[+].url = "type"'
  - 'extension[=].extension[=].valueCode = #Patient'
items:
  - linkId: g
    type: group
    extensions:
      - url: variable
        name: x
        expression: '%y'
    fsh:
      - 'modifierExtension[0].url = "http://hl7.org/fhir/StructureDefinition/variable"'
      - 'modifierExtension[=].valueExpression.name = "w"'
      - 'modifierExtension[=].valueExpression.language = #text/fhirpath'
      - 'modifierExtension[=].valueExpression.expression = "0"'
      - 'modifierExtension[+].url = "http://hl7.org/fhir/StructureDefinition/variable"'
      - 'modifierExtension[=].valueExpression.name = "y"'
      - 'modifierExtension[=].valueExpression.language = #text/fhirpath'
      - 'modifierExtension[=].valueExpression.expression = "1"'
    items:
      - linkId: q
        type: string
        extensions:
          - url: initialExpression
            expression: '%x'
