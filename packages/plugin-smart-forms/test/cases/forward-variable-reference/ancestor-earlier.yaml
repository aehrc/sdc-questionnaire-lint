# Children a, b and 1.1 of group 1: the integer-like 1 comes first in key order.
rules:
  sdc/unused-declaration: 'off'
fsh:
  - 'extension[+].url = "http://hl7.org/fhir/uv/sdc/StructureDefinition/sdc-questionnaire-launchContext"'
  - 'extension[=].extension[0].url = "name"'
  - 'extension[=].extension[=].valueCoding = http://hl7.org/fhir/uv/sdc/CodeSystem/launchContext#patient'
  - 'extension[=].extension[+].url = "type"'
  - 'extension[=].extension[=].valueCode = #Patient'
items:
  - linkId: '1'
    type: group
    extensions:
      - url: variable
        name: y
        expression: '1'
    items:
      - linkId: 'a'
        type: string
        extensions:
          - url: variable
            name: xa
            expression: '%y'
          - url: initialExpression
            expression: '%xa'
      - linkId: 'b'
        type: string
        extensions:
          - url: variable
            name: xb
            expression: '%y'
          - url: initialExpression
            expression: '%xb'
      - linkId: '1.1'
        type: string
        extensions:
          - url: variable
            name: x11
            expression: '%y'
          - url: initialExpression
            expression: '%x11'
