# The itemPopulationContext's item has a linkId another item also has, so population order is
# unknown.
rules:
  sdc/unused-declaration: 'off'
fsh:
  - 'extension[+].url = "http://hl7.org/fhir/uv/sdc/StructureDefinition/sdc-questionnaire-launchContext"'
  - 'extension[=].extension[0].url = "name"'
  - 'extension[=].extension[=].valueCoding = http://hl7.org/fhir/uv/sdc/CodeSystem/launchContext#patient'
  - 'extension[=].extension[+].url = "type"'
  - 'extension[=].extension[=].valueCode = #Patient'
items:
  - linkId: g
    type: group
    extensions:
      - url: itemPopulationContext
        name: ctx
        expression: '%patient.name'
    items:
      - linkId: a
        type: group
        extensions:
          - url: variable
            name: x
            expression: '%ctx.given.first()'
        items:
          - linkId: q
            type: string
            extensions:
              - url: initialExpression
                expression: '%x'
  - linkId: g
    type: string
