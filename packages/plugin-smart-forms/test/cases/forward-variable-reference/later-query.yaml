# A later application/x-fhir-query variable, on the root and on an item, is fetched first.
rules:
  sdc/unused-declaration: 'off'
extensions:
  - url: variable
    name: x
    expression: '%obs.total'
  - url: variable
    name: obs
    language: application/x-fhir-query
    expression: 'Observation?code=1'
fsh:
  - 'extension[+].url = "http://hl7.org/fhir/uv/sdc/StructureDefinition/sdc-questionnaire-launchContext"'
  - 'extension[=].extension[0].url = "name"'
  - 'extension[=].extension[=].valueCoding = http://hl7.org/fhir/uv/sdc/CodeSystem/launchContext#patient'
  - 'extension[=].extension[+].url = "type"'
  - 'extension[=].extension[=].valueCode = #Patient'
items:
  - linkId: q
    type: string
    extensions:
      - url: initialExpression
        expression: '%x'
  - linkId: g
    type: group
    extensions:
      - url: variable
        name: w
        expression: '%obs2.total'
      - url: variable
        name: obs2
        language: application/x-fhir-query
        expression: 'Observation?code=2'
    items:
      - linkId: r
        type: string
        extensions:
          - url: initialExpression
            expression: '%w'
