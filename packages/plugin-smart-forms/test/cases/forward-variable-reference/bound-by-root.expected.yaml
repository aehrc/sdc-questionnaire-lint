- ruleId: sdc/shadowed-declaration
  severity: info
  at: input/fsh/forward-variable-reference-bound-by-root.fsh:23:54
  message: The name %y on item g is also declared on the Questionnaire root, so other expressions on item g and its descendant items get this declaration's value.
  help: rename one of the declarations of %y, unless this item should override it
  expression:
    text: item
  related:
    - at: /extension/0/valueExpression/expression (source-unavailable)
      message: '%y is also declared here'
- ruleId: smart-forms/variable-name-collision
  severity: error
  at: input/fsh/forward-variable-reference-bound-by-root.fsh:23:54
  message: "%y is also declared on the Questionnaire root; Smart Forms keeps one value for each name, so expressions on either element can get the other's value."
  help: rename one of the declarations so the name is declared on one element only
  expression:
    text: item
  related:
    - at: /extension/0/valueExpression/expression (source-unavailable)
      message: '%y is also declared here'
