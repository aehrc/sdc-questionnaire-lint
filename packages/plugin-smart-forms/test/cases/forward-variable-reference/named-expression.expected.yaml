- ruleId: smart-forms/named-expression-not-referenceable
  severity: error
  at: input/fsh/forward-variable-reference-named-expression.fsh:15:54
  message: '%y refers to the calculatedExpression on item g, which Smart Forms does not make available to other expressions, so the reference never gets its value.'
  help: declare the value as a variable with a name no other declaration uses, on this item or an ancestor, and reference that
  expression:
    text: '%y'
    range:
      startOffset: 0
      endOffset: 2
  related:
    - at: /item/0/extension/1/valueExpression/expression (source-unavailable)
      message: '%y is declared here'
