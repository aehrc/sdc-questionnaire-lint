- ruleId: smart-forms/forward-variable-reference
  severity: warning
  at: input/fsh/forward-variable-reference-iif-criterion.fsh:8:50
  message: '%x references %y on the Questionnaire root, which Smart Forms evaluates after %x when it prefills the form, so %x has no value while the form is prefilled.'
  help: move %y before %x on the Questionnaire root
  expression:
    text: iif(%y.exists(), 'a', 'b')
    range:
      startOffset: 4
      endOffset: 6
  related:
    - at: /extension/1/valueExpression/expression (source-unavailable)
      message: '%y is declared here'
    - at: /item/0/extension/0/valueExpression/expression (source-unavailable)
      message: this prefill expression uses %x
