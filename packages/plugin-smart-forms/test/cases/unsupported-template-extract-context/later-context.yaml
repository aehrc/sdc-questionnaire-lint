# A second templateExtractContext in an extension array, which Smart Forms never reads.
items:
  - linkId: bp
    type: group
    text: 'Blood pressure'
    fsh:
      - 'extension[+].url = "http://hl7.org/fhir/uv/sdc/StructureDefinition/sdc-questionnaire-templateExtract"'
      - 'extension[=].extension[0].url = "template"'
      - 'extension[=].extension[=].valueReference.reference = "#later-context"'
    items:
      - linkId: systolic
        type: decimal
contained:
  - resourceType: Observation
    fsh:
      - 'id = "later-context"'
      - 'status = #final'
      - 'code.text = "Blood pressure"'
      - 'component[0].code.text = "Systolic"'
      - 'component[0].extension[0].url = "http://hl7.org/fhir/uv/sdc/StructureDefinition/sdc-questionnaire-templateExtractContext"'
      - 'component[0].extension[0].valueString = "item.where(linkId = ''systolic'')"'
      - 'component[0].extension[1].url = "http://hl7.org/fhir/uv/sdc/StructureDefinition/sdc-questionnaire-templateExtractContext"'
      - 'component[0].extension[1].valueExpression.language = #text/fhirpath'
      - 'component[0].extension[1].valueExpression.expression = "item.where(linkId = ''diastolic'')"'
