# A text/cql context: help asks for a FHIRPath expression, not the same FHIRPath.
items:
  - linkId: bp
    type: group
    text: 'Blood pressure'
    fsh:
      - 'extension[+].url = "http://hl7.org/fhir/uv/sdc/StructureDefinition/sdc-questionnaire-templateExtract"'
      - 'extension[=].extension[0].url = "template"'
      - 'extension[=].extension[=].valueReference.reference = "#cql-context"'
    items:
      - linkId: systolic
        type: decimal
contained:
  - resourceType: Observation
    fsh:
      - 'id = "cql-context"'
      - 'status = #final'
      - 'code.text = "Blood pressure"'
      - 'component[0].code.text = "Systolic"'
      - 'component[0].extension[0].url = "http://hl7.org/fhir/uv/sdc/StructureDefinition/sdc-questionnaire-templateExtractContext"'
      - 'component[0].extension[0].valueExpression.language = #text/cql'
      - 'component[0].extension[0].valueExpression.expression = "Systolic"'
