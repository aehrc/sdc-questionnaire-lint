# A templateExtractBundle, which Smart Forms does not read.
items:
  - linkId: bp
    type: group
    text: 'Blood pressure'
    fsh:
      - 'extension[+].url = "http://hl7.org/fhir/uv/sdc/StructureDefinition/sdc-questionnaire-templateExtractBundle"'
      - 'extension[=].valueReference.reference = "#bundle"'
    items:
      - linkId: systolic
        type: decimal
contained:
  - resourceType: Bundle
    fsh:
      - 'id = "bundle"'
      - 'type = #transaction'
      - 'entry[0].fullUrl = "urn:uuid:4b1a2c3d-0000-4000-8000-000000000001"'
      - 'entry[0].extension[0].url = "http://hl7.org/fhir/uv/sdc/StructureDefinition/sdc-questionnaire-templateExtractContext"'
      - 'entry[0].extension[0].valueExpression.language = #text/fhirpath'
      - 'entry[0].extension[0].valueExpression.expression = "item.where(linkId = ''systolic'')"'
