# The input's linkId is the same in every repetition.
items:
  - linkId: g
    type: group
    text: Medication
    fsh:
      - 'repeats = true'
    extensions:
      - url: variable
        name: id
        expression: 'linkId'
      - url: variable
        name: v
        expression: '%context.linkId & %id'
    items:
      - linkId: a
        type: string
        extensions:
          - url: calculatedExpression
            expression: '%v'
