# Nothing references %v, so its value is never used.
items:
  - linkId: g
    type: group
    text: Medication
    fsh:
      - 'repeats = true'
    extensions:
      - url: variable
        name: v
        expression: 'item.answer.value'
    items:
      - linkId: a
        type: string
        extensions:
          - url: calculatedExpression
            expression: "'x'"
