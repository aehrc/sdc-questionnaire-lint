# %total depends on %dose, an earlier variable on the same item that reads its input.
items:
  - linkId: g
    type: group
    text: Medication
    fsh:
      - 'repeats = true'
    extensions:
      - url: variable
        name: dose
        expression: 'item.answer.value'
      - url: variable
        name: total
        expression: '%dose.count()'
    items:
      - linkId: a
        type: string
        extensions:
          - url: calculatedExpression
            expression: '%total'
