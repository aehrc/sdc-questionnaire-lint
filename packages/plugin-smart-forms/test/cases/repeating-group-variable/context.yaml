# %context is the repetition the variable is evaluated on.
items:
  - linkId: g
    type: group
    text: Medication
    fsh:
      - 'repeats = true'
    extensions:
      - url: variable
        name: v
        expression: '%context.item.answer.value'
    items:
      - linkId: a
        type: string
        extensions:
          - url: calculatedExpression
            expression: '%v'
