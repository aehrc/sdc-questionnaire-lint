- ruleId: smart-forms/unsupported-expression-language
  severity: error
  at: input/fsh/unsupported-expression-language-expression-kinds.fsh:10:51
  message: Smart Forms ignores this calculatedExpression on item "Calculated" (calculated) because it is written in application/x-fhir-query; it uses only text/fhirpath here, so the answer is never calculated from it.
  help: rewrite it in FHIRPath with the language text/fhirpath; to use server data, fetch it in an application/x-fhir-query variable on this item or an ancestor and reference that variable
  expression:
    text: Observation?code=x
- ruleId: smart-forms/unsupported-expression-language
