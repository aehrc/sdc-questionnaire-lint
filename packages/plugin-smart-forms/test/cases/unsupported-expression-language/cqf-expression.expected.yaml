- ruleId: smart-forms/unsupported-expression-language
  severity: error
  at: input/fsh/unsupported-expression-language-cqf-expression.fsh:10:56
  message: Smart Forms ignores this cqf-expression on text on item "Text" (text) because it is written in text/cql; it uses only text/fhirpath here, so the text is not updated from it.
  help: rewrite it in FHIRPath with the language text/fhirpath; to use server data, fetch it in an application/x-fhir-query variable on this item or an ancestor and reference that variable
  expression:
    text: "'text'"
