- ruleId: sdc/shadowed-declaration
  severity: info
  at: input/fsh/unsupported-expression-language-fhirpath-namesake.fsh:15:51
  message: The name %x on item "Age" (age) is also declared on the Questionnaire root, so other expressions on item "Age" (age) and its descendant items get this declaration's value.
  help: rename one of the declarations of %x, unless this item should override it
  expression:
    text: '2'
  related:
    - at: /extension/0/valueExpression/expression (source-unavailable)
      message: '%x is also declared here'
- ruleId: sdc/unused-declaration
  severity: warning
  at: input/fsh/unsupported-expression-language-fhirpath-namesake.fsh:15:51
  message: '%x is declared on item "Age" (age), but no expression references it, so its value is never used.'
  help: remove the variable, or reference %x where its value is needed
  expression:
    text: '2'
- ruleId: smart-forms/unsupported-expression-language
  severity: error
  at: input/fsh/unsupported-expression-language-fhirpath-namesake.fsh:15:51
  message: Smart Forms ignores this variable on item "Age" (age) because it is written in text/cql; it uses only text/fhirpath here, so this variable never sets %x.
  help: rewrite it in FHIRPath with the language text/fhirpath; to use server data, fetch it in an application/x-fhir-query variable on this item or an ancestor and reference that variable
  expression:
    text: '2'
