- ruleId: sdc/shadowed-declaration
  severity: info
  at: input/fsh/variable-name-collision-source-query-names.fsh:21:51
  message: The name %prepop on item a is also declared on the Questionnaire root, so other expressions on item a and its descendant items get this declaration's value.
  help: rename one of the declarations of %prepop, unless this item should override it
  expression:
    text: '2'
  related:
    - at: /extension/0/valueExpression/expression (source-unavailable)
      message: '%prepop is also declared here'
- ruleId: smart-forms/variable-name-collision
  severity: error
  at: input/fsh/variable-name-collision-source-query-names.fsh:8:43
  message: "%prepop is also the name of a sourceQueries result; Smart Forms keeps one value for each name, so expressions that read either can get the other's value."
  help: rename the declaration
  expression:
    text: '1'
  related:
    - at: /extension/1 (source-unavailable)
      message: '%prepop is also the name of this sourceQueries result'
