- ruleId: sdc/shadowed-declaration
  severity: info
  at: input/fsh/variable-name-collision-ancestor.fsh:16:59
  message: The name %x on item a is also declared on item g, so other expressions on item a and its descendant items get this declaration's value.
  help: rename one of the declarations of %x, unless this item should override it
  expression:
    text: "'item'"
  related:
    - at: /item/0/extension/0/valueExpression/expression (source-unavailable)
      message: '%x is also declared here'
- ruleId: smart-forms/variable-name-collision
  severity: error
  at: input/fsh/variable-name-collision-ancestor.fsh:16:59
  message: "%x is also declared on item g; Smart Forms keeps one value for each name, so expressions on either element can get the other's value."
  help: rename one of the declarations so the name is declared on one element only
  expression:
    text: "'item'"
  related:
    - at: /item/0/extension/0/valueExpression/expression (source-unavailable)
      message: '%x is also declared here'
