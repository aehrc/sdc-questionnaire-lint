- ruleId: smart-forms/variable-name-collision
  severity: error
  at: input/fsh/variable-name-collision-root-and-duplicate.fsh:14:54
  message: "%x is also declared on the Questionnaire root; Smart Forms keeps one value for each name, so expressions on either element can get the other's value."
  help: rename one of the declarations so the name is declared on one element only
  expression:
    text: "'first'"
  related:
