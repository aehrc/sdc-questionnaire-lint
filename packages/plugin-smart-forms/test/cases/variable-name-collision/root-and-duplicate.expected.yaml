- ruleId: sdc/duplicate-declaration
  severity: error
  at: input/fsh/variable-name-collision-root-and-duplicate.fsh:18:54
  message: The name %x is declared more than once on item a, so it is unclear which value expressions that use it get.
  help: rename or remove one of the declarations of %x
  expression:
    text: "'second'"
  related:
    - at: /item/0/extension/0/valueExpression/expression (source-unavailable)
      message: '%x is also declared here'
- ruleId: sdc/shadowed-declaration
  severity: info
  at: input/fsh/variable-name-collision-root-and-duplicate.fsh:14:54
  message: The name %x on item a is also declared on the Questionnaire root, so other expressions on item a and its descendant items get this declaration's value.
  help: rename one of the declarations of %x, unless this item should override it
  expression:
    text: "'first'"
  related:
    - at: /extension/0/valueExpression/expression (source-unavailable)
      message: '%x is also declared here'
