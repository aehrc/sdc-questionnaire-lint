- ruleId: sdc/shadowed-declaration
  severity: info
  at: input/fsh/variable-name-collision-launch-context.fsh:15:51
  message: The name %patient on item a is also declared on the Questionnaire root, so other expressions on item a and its descendant items get this declaration's value.
  help: rename one of the declarations of %patient, unless this item should override it
  expression:
    text: "'not a patient'"
  related:
    - at: /extension/0 (source-unavailable)
      message: '%patient is also declared here'
- ruleId: smart-forms/variable-name-collision
  severity: error
  at: input/fsh/variable-name-collision-launch-context.fsh:15:51
  message: "%patient is also declared on the Questionnaire root; Smart Forms keeps one value for each name, so expressions on either element can get the other's value."
  help: rename one of the declarations so the name is declared on one element only
  expression:
    text: "'not a patient'"
  related:
    - at: /extension/0 (source-unavailable)
      message: '%patient is also declared here'
