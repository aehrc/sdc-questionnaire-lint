# sourceQueries references #prepop, but no contained Bundle has that id, so population binds no
# %prepop for the variable to collide with.
rules:
  sdc/unused-declaration: 'off'
extensions:
  - url: variable
    name: prepop
    expression: '1'
fsh:
  - 'extension[+].url = "http://hl7.org/fhir/uv/sdc/StructureDefinition/sdc-questionnaire-sourceQueries"'
  - 'extension[=].valueReference.reference = "#prepop"'
items:
  - linkId: q
    type: string
