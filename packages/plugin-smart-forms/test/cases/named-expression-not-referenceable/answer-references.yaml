# After a patient launchContext head, the renderer gives an answerExpression no other name: a
# FHIRPath variable and another launchContext are reported; a later reference to the head is not.
rules:
  sdc/unused-declaration: 'off'
fsh:
  - 'extension[+].url = "http://hl7.org/fhir/uv/sdc/StructureDefinition/sdc-questionnaire-launchContext"'
  - 'extension[=].extension[0].url = "name"'
  - 'extension[=].extension[=].valueCoding = http://hl7.org/fhir/uv/sdc/CodeSystem/launchContext#patient'
  - 'extension[=].extension[+].url = "type"'
  - 'extension[=].extension[=].valueCode = #Patient'
  - 'extension[+].url = "http://hl7.org/fhir/uv/sdc/StructureDefinition/sdc-questionnaire-launchContext"'
  - 'extension[=].extension[0].url = "name"'
  - 'extension[=].extension[=].valueCoding = http://hl7.org/fhir/uv/sdc/CodeSystem/launchContext#user'
  - 'extension[=].extension[+].url = "type"'
  - 'extension[=].extension[=].valueCode = #Practitioner'
extensions:
  - url: variable
    name: system
    expression: "'http://loinc.org'"
items:
  - linkId: answers
    type: coding
    text: Answers
    extensions:
      - url: answerExpression
        expression: '%patient.extension.value.coding.where(system = %system and code != %user.id and code != %patient.id)'
