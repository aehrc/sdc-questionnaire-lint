- ruleId: smart-forms/named-expression-not-referenceable
  severity: error
  at: input/fsh/named-expression-not-referenceable-host-name.fsh:14:54
  message: '%x refers to the calculatedExpression on item "A" (a), which Smart Forms does not make available to other expressions, so the reference never gets its value.'
  help: declare the value as a variable with a name no other declaration uses, on this item or an ancestor, and reference that
  expression:
    text: "%x = 'a'"
    range:
      startOffset: 0
      endOffset: 2
  related:
    - at: /item/0/extension/0/valueExpression/expression (source-unavailable)
      message: '%x is declared here'
