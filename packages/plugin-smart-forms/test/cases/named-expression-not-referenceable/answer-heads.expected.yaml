- ruleId: smart-forms/named-expression-not-referenceable
  severity: error
  at: input/fsh/named-expression-not-referenceable-answer-heads.fsh:22:51
  message: Smart Forms computes an answerExpression only when it starts with a launch context or with an application/x-fhir-query variable that expands a ValueSet, and %codes is neither, so the answers on item "FHIRPath variable" (fhirpath-variable) are never computed from this expression.
  help: start the expression with a launch context, or with an application/x-fhir-query variable whose expression is a ValueSet URL, or list the answers with answerOption or answerValueSet
  expression:
    text: '%codes.where(%search.exists())'
    range:
      startOffset: 0
      endOffset: 6
  related:
    - at: /extension/0/valueExpression/expression (source-unavailable)
      message: '%codes is declared here'
