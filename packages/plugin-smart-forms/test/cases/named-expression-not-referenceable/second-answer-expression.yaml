# The renderer reads only the first text/fhirpath answerExpression on an item, so the second one's
# head is not reported.
rules:
  sdc/unused-declaration: 'off'
fsh:
  - 'extension[+].url = "http://hl7.org/fhir/uv/sdc/StructureDefinition/sdc-questionnaire-launchContext"'
  - 'extension[=].extension[0].url = "name"'
  - 'extension[=].extension[=].valueCoding = http://hl7.org/fhir/uv/sdc/CodeSystem/launchContext#patient'
  - 'extension[=].extension[+].url = "type"'
  - 'extension[=].extension[=].valueCode = #Patient'
extensions:
  - url: variable
    name: codes
    expression: '%resource.item.answer.value'
items:
  - linkId: a
    type: coding
    extensions:
      - url: answerExpression
        expression: '%patient.extension.value.coding'
      - url: answerExpression
        expression: '%codes.first()'
