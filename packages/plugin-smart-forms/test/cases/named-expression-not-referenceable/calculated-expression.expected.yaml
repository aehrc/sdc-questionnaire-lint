- ruleId: smart-forms/named-expression-not-referenceable
  severity: error
  at: input/fsh/named-expression-not-referenceable-calculated-expression.fsh:14:54
  message: '%score refers to the calculatedExpression on item "Score" (score), which Smart Forms does not make available to other expressions, so the reference never gets its value.'
  help: declare the value as a variable with a name no other declaration uses, on this item or an ancestor, and reference that
  expression:
    text: '%score > 0'
    range:
      startOffset: 0
      endOffset: 6
  related:
    - at: /item/0/extension/0/valueExpression/expression (source-unavailable)
      message: '%score is declared here'
