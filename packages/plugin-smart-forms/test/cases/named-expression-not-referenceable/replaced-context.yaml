# Two itemPopulationContexts %c on different groups: population evaluates only the second, and
# smart-forms/variable-name-collision reports the pair. References to the first, at a
# calculatedExpression and at an answerExpression, are not reported here.
fsh:
  - 'extension[+].url = "http://hl7.org/fhir/uv/sdc/StructureDefinition/sdc-questionnaire-launchContext"'
  - 'extension[=].extension[0].url = "name"'
  - 'extension[=].extension[=].valueCoding = http://hl7.org/fhir/uv/sdc/CodeSystem/launchContext#patient'
  - 'extension[=].extension[+].url = "type"'
  - 'extension[=].extension[=].valueCode = #Patient'
items:
  - linkId: g
    type: group
    extensions:
      - url: itemPopulationContext
        name: c
        expression: '%resource.item'
    items:
      - linkId: calculated
        type: string
        extensions:
          - url: calculatedExpression
            expression: '%c.linkId'
      - linkId: head
        type: coding
        extensions:
          - url: answerExpression
            expression: '%c.answer.value'
      - linkId: after
        type: coding
        extensions:
          - url: answerExpression
            expression: '%patient.extension.value.coding.where(code = %c.linkId)'
  - linkId: h
    type: group
    extensions:
      - url: itemPopulationContext
        name: c
        expression: '%resource.item'
    items:
      - linkId: h1
        type: string
