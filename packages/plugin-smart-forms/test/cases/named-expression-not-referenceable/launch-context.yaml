# A launchContext is not reported: whether population binds it depends on what the host supplies.
# Neither is one written type-first, which binds nothing, at a calculatedExpression or as the head
# of an answerExpression.
fsh:
  - 'extension[+].url = "http://hl7.org/fhir/uv/sdc/StructureDefinition/sdc-questionnaire-launchContext"'
  - 'extension[=].extension[0].url = "name"'
  - 'extension[=].extension[=].valueCoding = http://hl7.org/fhir/uv/sdc/CodeSystem/launchContext#encounter'
  - 'extension[=].extension[+].url = "type"'
  - 'extension[=].extension[=].valueCode = #Encounter'
  - 'extension[+].url = "http://hl7.org/fhir/uv/sdc/StructureDefinition/sdc-questionnaire-launchContext"'
  - 'extension[=].extension[0].url = "type"'
  - 'extension[=].extension[=].valueCode = #Patient'
  - 'extension[=].extension[+].url = "name"'
  - 'extension[=].extension[=].valueCoding = http://hl7.org/fhir/uv/sdc/CodeSystem/launchContext#patient'
items:
  - linkId: calculated
    type: string
    extensions:
      - url: calculatedExpression
        expression: '%encounter.id & %patient.id'
  - linkId: answer
    type: coding
    extensions:
      - url: answerExpression
        expression: '%patient.extension.value.coding'
