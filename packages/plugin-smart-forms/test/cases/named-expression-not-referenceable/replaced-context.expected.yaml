- ruleId: smart-forms/variable-name-collision
  severity: error
  at: input/fsh/named-expression-not-referenceable-replaced-context.fsh:36:51
  message: "%c is also declared on item g; Smart Forms keeps one value for each name, so expressions on either element can get the other's value."
  help: rename one of the declarations so the name is declared on one element only
  expression:
    text: '%resource.item'
  related:
    - at: /item/0/extension/0/valueExpression/expression (source-unavailable)
      message: '%c is also declared here'
